services:
  postgres:
    image: postgres:16
    container_name: books_postgres
    restart: always
    profiles: ["core", "full"]
    environment:
      POSTGRES_DB: booksdb
      POSTGRES_USER: ${PG_USER}
      POSTGRES_PASSWORD: ${PG_PASS}
    ports:
      - "5432:5432"
    volumes:
      - ./pgdata:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER} -d booksdb"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.15.1
    container_name: qdrant
    profiles: ["core", "full"]
    ports:
      - "6333:6333"
    environment:
      QDRANT__STORAGE__PATH: /qdrant/storage
      QDRANT__STORAGE__WAL__CAPACITY_MB: 16
    volumes:
      - ./qdrant_data:/qdrant/storage

  phoenix:
    image: arizephoenix/phoenix:12.30.0
    container_name: phoenix
    profiles: ["observability", "full"]
    ports:
      - "6006:6006"
      - "4317:4317"
    environment:
      PHOENIX_WORKING_DIR: /phoenix-data
    volumes:
      - phoenix_data:/phoenix-data

  ollama:
    image: ollama/ollama:latest
    container_name: doc-mate-ollama
    profiles: ["local-ai"]
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 10G
          cpus: '4.0'
    environment:
      OLLAMA_NUM_PARALLEL: 1
      OLLAMA_MAX_LOADED_MODELS: 1

  app:
    build: .
    container_name: bookmate_app
    restart: always
    profiles: ["core", "full"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      PG_USER: ${PG_USER}
      PG_PASS: ${PG_PASS}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_DB: booksdb
      QDRANT_HOST: qdrant
      QDRANT_PORT: 6333
      PHOENIX_COLLECTOR_ENDPOINT: http://phoenix:4317
      LLM_PROVIDER: ${LLM_PROVIDER:-openai}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3.2:3b}
      PRIVACY_MODE: ${PRIVACY_MODE:-false}
    ports:
      - "7860:7860"
    volumes:
      - ./DATA:/app/DATA
      - ./INDEXES:/app/INDEXES
      - ./src:/app/src
      - ./hf_cache:/root/.cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started

volumes:
  phoenix_data: {}
  pgdata:
    driver: local
  ollama-models:
    name: doc-mate-ollama-models